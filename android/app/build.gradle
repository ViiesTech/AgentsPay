apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
react {
    // ... (no changes)
}
/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.agents_pay"
    defaultConfig {
        applicationId "com.agents_pay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "2.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Specify the path to your keystore file
            storeFile file("my-release-key.keystore")
            // Keystore password
            storePassword 'thepreators'
            // Key alias
            keyAlias 'my-key-alias'
            // Key password
            keyPassword 'thepreators'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
      release {
            // Use the signing configuration for the release build
            signingConfig signingConfigs.release
            // Optionally, you can enable code shrinking, obfuscation, etc.
            minifyEnabled false // Change to true if you want to enable ProGuard or R8
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
     implementation project(':react-native-async-storage_async-storage')
     implementation project(':react-native-checkbox')
     implementation project(':react-native-geolocation-service')
    implementation project(':@react-native-community_geolocation')
     implementation project(':@react-native-firebase_app')
     implementation project(':@react-native-firebase_messaging')
     implementation project(':react-native-device-info')
     implementation project(':react-native-document-picker')
     implementation project(':react-native-fs')
     implementation project(':react-native-image-picker')
     implementation project(':react-native-restart')
     implementation project(':react-native-safe-area-context')
     implementation project(':react-native-screens')
     implementation project(':react-native-svg')
     implementation project(':react-native-webview')
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}